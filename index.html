<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nonogram Hall</title>
<meta name="description" content="Solve picture logic puzzles against the clock and climb the leaderboard.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M2 2h6v6H2zM14 2h6v6h-6zM8 8h6v6H8zM2 14h6v6H2zM20 14h6v6h-6zM8 20h12v6H8z' fill='%2315202b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --surface-2: #f4f6f8;
  --ink: #15202b;
  --ink-2: #4a5967;
  --line: #c5ced7;
  --line-strong: #8794a1;
  --accent: #2447d6;
  --accent-ink: #ffffff;
  --cell-fill: #15202b;
  --cell-x: #8794a1;
  --good: #157f4b;
  --good-bg: #dcf2e6;
  --warn: #8a5300;
  --warn-bg: #fbeccb;
  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #171f27; --surface-2: #1e2831; --ink: #e7ecf1; --ink-2: #a3b0bc;
    --line: #2c3945; --line-strong: #5d6f80; --accent: #8ba2ff; --accent-ink: #0f151b;
    --cell-fill: #e7ecf1; --cell-x: #71818f; --good: #5fd39a; --good-bg: #12342a;
    --warn: #f0c36a; --warn-bg: #3a2c0f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #171f27; --surface-2: #1e2831; --ink: #e7ecf1; --ink-2: #a3b0bc;
  --line: #2c3945; --line-strong: #5d6f80; --accent: #8ba2ff; --accent-ink: #0f151b;
  --cell-fill: #e7ecf1; --cell-x: #71818f; --good: #5fd39a; --good-bg: #12342a;
  --warn: #f0c36a; --warn-bg: #3a2c0f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
.wrap { max-width: 880px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.15; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 8px 20px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 28px; height: 28px; color: var(--ink); flex: none; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 500; color: var(--ink-2); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); max-width: 100%; min-width: 0; }
.chip img { width: 26px; height: 26px; border-radius: 50%; flex: none; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.note { border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; background: var(--warn-bg); color: var(--warn); }
.note.info { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }

/* library */
.lib-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 18px; }
.lib-head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.stat { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }
.group { margin-bottom: 30px; }
.group h3 { font-size: 18px; font-weight: 600; display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.group h3 small { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--ink-2); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card:hover { border-color: var(--line-strong); }
.thumb { aspect-ratio: 1; width: 100%; max-width: 100%; background: var(--surface-2); border-radius: 6px; display: grid; place-items: center; color: var(--cell-fill); overflow: hidden; }
.thumb svg { width: 100%; height: 100%; display: block; }
.card .t { font-weight: 600; font-size: 14px; }
.card .m { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.card.solved .m { color: var(--good); }
.rand { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.field input { font: inherit; font-family: var(--font-mono); font-size: 14px; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); color: var(--ink); width: 130px; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }

/* play */
.play-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.play-head h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-right: auto; }
.timer { font-family: var(--font-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sw { width: 12px; height: 12px; background: currentColor; display: inline-block; }
.hint { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; }
.board-host { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; overflow-x: auto; }
.board { --cs: 30px; --fs: 14px; display: grid; grid-template-columns: auto calc(var(--n) * var(--cs)); width: max-content; margin: 0 auto; user-select: none; -webkit-user-select: none; }
.colclues { display: grid; grid-template-columns: repeat(var(--n), var(--cs)); align-items: end; padding-bottom: 6px; }
.colclue { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-family: var(--font-mono); font-size: var(--fs); line-height: 1.2; font-weight: 500; }
.rowclues { display: grid; grid-template-rows: repeat(var(--n), var(--cs)); padding-right: 8px; }
.rowclue { display: flex; align-items: center; justify-content: flex-end; gap: calc(var(--fs) * 0.55); font-family: var(--font-mono); font-size: var(--fs); font-weight: 500; }
.colclue.ok, .rowclue.ok { color: var(--ink-2); opacity: 0.4; }
.cells { display: grid; grid-template-columns: repeat(var(--n), var(--cs)); grid-template-rows: repeat(var(--n), var(--cs)); border-left: 2px solid var(--line-strong); border-top: 2px solid var(--line-strong); touch-action: none; }
.cell { background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
.cell.gr { border-right: 2px solid var(--line-strong); }
.cell.gb { border-bottom: 2px solid var(--line-strong); }
.cell.f { background: var(--cell-fill); }
.cell.x::before { content: "\00d7"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--cell-x); font-size: calc(var(--cs) * 0.72); line-height: 1; }
.result { margin-top: 16px; border-radius: 14px; padding: 16px; background: var(--good-bg); color: var(--ink); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.result .art { width: 84px; height: 84px; color: var(--cell-fill); background: var(--surface); border-radius: 8px; padding: 6px; flex: none; }
.result h3 { font-size: 22px; font-weight: 800; }
.result p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.result .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.ok-text { color: var(--good); font-weight: 600; }

/* leaderboard */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 0; margin-bottom: 24px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); padding: 10px 16px; }
td { padding: 10px 16px; border-top: 1px solid var(--line); }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.rank { width: 56px; font-family: var(--font-mono); color: var(--ink-2); }
tr.me td { background: var(--surface-2); font-weight: 600; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who img { width: 24px; height: 24px; border-radius: 50%; flex: none; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.sel { font: inherit; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 100%; }
.row-h { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 12px; }
.row-h h3, h3.row-h { font-size: 20px; font-weight: 600; margin-right: auto; }
@media (prefers-reduced-motion: no-preference) { .card, .btn { transition: border-color 0.12s, filter 0.12s; } }
.chip .btn { padding: 4px 12px; font-size: 13px; }

/* sign-in dialog */
dialog.auth { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(380px, calc(100vw - 32px)); }
dialog.auth::backdrop { background: rgb(15 21 27 / 0.45); }
.auth form { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.auth h3 { font-size: 22px; font-weight: 800; }
.auth .field input { width: 100%; }
.auth .err { color: #b3261e; font-size: 13px; margin: 0; }
:root[data-theme="dark"] .auth .err { color: #ff8a80; }
@media (prefers-color-scheme: dark) { .auth .err { color: #ff8a80; } }
.auth .ok { color: var(--good); font-size: 13px; margin: 0; }
.auth .links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
.auth .acts { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true" fill="currentColor"><rect x="2" y="2" width="6" height="6"/><rect x="14" y="2" width="6" height="6"/><rect x="8" y="8" width="6" height="6"/><rect x="2" y="14" width="6" height="6"/><rect x="20" y="14" width="6" height="6"/><rect x="8" y="20" width="12" height="6"/></svg>
      Nonogram Hall
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" id="tab-puzzles" type="button">Puzzles</button>
      <button class="tab" id="tab-board" type="button">Leaderboard</button>
    </nav>
    <div class="chip" id="chip"><span>Guest</span></div>
  </header>
  <main id="view"></main>
</div>


<dialog class="auth" id="auth"></dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
